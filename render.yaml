services:
  - type: web
    name: roy-moshe-memorial
    runtime: node
    plan: starter
    branch: main
    buildCommand: bash scripts/production-build.sh
    preDeployCommand: bash scripts/production-migrate.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: artifacts/roy-memorial/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: roy-moshe-memorial-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: roy-moshe-memorial-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: roy_memorial
    user: roy_memorial
